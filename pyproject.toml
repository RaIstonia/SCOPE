[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "discogr"
version = "0.1.0"
description = "Disentangled Semantic-Collaborative Generative Recommendation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "CC-BY-NC-4.0"}
dependencies = [
  "torch>=2.1",
  "accelerate>=0.30",
  "datasets>=2.18",
  "numpy>=1.24",
  "PyYAML>=6.0",
  "transformers>=4.40",
  "tqdm>=4.66",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "pandas>=2.0",
  "tensorboard>=2.14",
  "tiktoken>=0.5",
  "requests>=2.31",
]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["genrec*", "tokenizer_triple*"]

[tool.ruff]
line-length = 100
target-version = "py310"
